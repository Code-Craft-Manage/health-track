services:
  healthtrack:
    build: .
    container_name: healthtrack
    environment:
      # Values are substituted from the deploy session's environment, which the
      # GitHub Actions workflow populates from repository secrets. No .env file
      # is ever written on the server.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - AUTHORIZED_USER_ID=${AUTHORIZED_USER_ID}
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
      - GOOGLE_SHEET_TAB=${GOOGLE_SHEET_TAB:-Measurements}
      - GOOGLE_OAUTH_TOKEN_B64=${GOOGLE_OAUTH_TOKEN_B64}
      - TZ=America/Sao_Paulo
    restart: unless-stopped
    # Persist per-user preferences (e.g. guide images on/off) across redeploys.
    volumes:
      - healthtrack-data:/app/data

volumes:
  healthtrack-data:
