name: Deploy Health-Track

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2244
          # Forward the app secrets into the remote shell so docker compose can
          # substitute them. No .env file is ever written on the server.
          envs: TELEGRAM_BOT_TOKEN,AUTHORIZED_USER_ID,GOOGLE_SHEET_ID,GOOGLE_SHEET_TAB,GOOGLE_OAUTH_TOKEN_B64
          script: |
            cd ~/htdocs/health-track.codecraftmanage.com
            git pull origin main
            docker compose up -d --build
            docker image prune -f
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AUTHORIZED_USER_ID: ${{ secrets.AUTHORIZED_USER_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_TAB: ${{ secrets.GOOGLE_SHEET_TAB }}
          GOOGLE_OAUTH_TOKEN_B64: ${{ secrets.GOOGLE_OAUTH_TOKEN_B64 }}
